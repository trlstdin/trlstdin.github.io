async function beginRTC(){if(window.CAST_IROH_CONFIG)return;lastRtcAttempt=performance.now();if(pc)pc.close();rtcReady=false;offerSent=false;iceQueue=[];remoteIce=[];lastPongAt=performance.now();pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.cloudflare.com:3478'},{urls:'stun:stun.l.google.com:19302'}],iceCandidatePoolSize:1});pc.addTransceiver('video',{direction:'recvonly'});pc.ontrack=e=>{media.srcObject=e.streams[0]||new MediaStream([e.track]);try{if('jitterBufferTarget'in e.receiver)e.receiver.jitterBufferTarget=0;if('playoutDelayHint'in e.receiver)e.receiver.playoutDelayHint=0;}catch(e){reportError('rtc-playout-options',e)}media.play().catch(e=>reportError('viewer-async',e));};rtcControl=pc.createDataChannel('control',{ordered:true});rtcVideo=pc.createDataChannel('video',{ordered:false,maxRetransmits:0});const reader=rtcReader(onMessage,e=>reportError('rtc-message',e));for(const ch of [rtcControl,rtcVideo]){ch.onmessage=e=>reader(e.data);ch.onopen=()=>{if(rtcControl.readyState==='open'&&rtcVideo.readyState==='open'){rtcReady=true;document.documentElement.dataset.transport='webrtc';send({type:'ping',sent:performance.now()});if(preferControl)send({type:'claim'})}};ch.onclose=()=>{rtcReady=false;document.documentElement.dataset.transport='websocket'}}pc.onicecandidate=e=>{if(e.candidate){const m={type:'signal',candidate:e.candidate.toJSON()};if(offerSent&&ws.readyState===1)ws.send(JSON.stringify(m));else iceQueue.push(m)}};pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState)){rtcReady=false;document.documentElement.dataset.transport='websocket'}};await pc.setLocalDescription(await pc.createOffer());ws.send(JSON.stringify({type:'signal',description:pc.localDescription.toJSON()}));offerSent=true;for(const m of iceQueue)ws.send(JSON.stringify(m));iceQueue=[];}
let remoteIce=[];async function signal(m){if(!pc)return;if(m.description){await pc.setRemoteDescription(m.description);for(const c of remoteIce)await pc.addIceCandidate(c);remoteIce=[]}else if(m.candidate){if(pc.remoteDescription)await pc.addIceCandidate(m.candidate);else remoteIce.push(m.candidate)}}
let forcedRecoveryTimer;function recoverTransport(message){if(forcedRecoveryTimer)return;markDisconnected(message);const old=ws;ws=null;inputSocket=null;connectionGeneration++;pc?.close();rtcReady=false;haveFrame=false;lastTransportAt=performance.now();old?.close();forcedRecoveryTimer=setTimeout(()=>{forcedRecoveryTimer=null;connect()},100)}
function connect(){
 connectingAt=performance.now();
 const generation=++connectionGeneration;
 const urls=[{url:baseURL.replace(/^http/,'ws')+'stream',mode:'tunnel'}];
 if(!window.CAST_IROH_CONFIG&&new URL(location.href).searchParams.get('transport')!=='webrtc')for(const port of [18766,18768])urls.push({url:'ws://127.0.0.1:'+port+new URL(baseURL).pathname+'stream',mode:'local'});
 const sockets=[];let selected=null,retryTimer;
 function retry(){if(!retryTimer)retryTimer=setTimeout(connect,100)}
 for(const endpoint of urls){let socket;try{socket=new WebSocket(endpoint.url)}catch(e){reportError('viewer-connect',e);continue}sockets.push(socket);
  socket.onmessage=e=>{if(generation!==connectionGeneration)return;let m;try{m=JSON.parse(e.data)}catch(error){reportError('viewer-message',error);return}
   if(m.type==='hello'&&(!selected||(netMode==='tunnel'&&endpoint.mode==='local'))){if(retryTimer){clearTimeout(retryTimer);retryTimer=null}const old=selected;selected=socket;ws=socket;inputSocket=socket;netMode=endpoint.mode;rtcReady=false;pc?.close();if(old)old.close();for(const other of sockets)if(other!==socket&&(endpoint.mode==='local'||other.url.startsWith('wss:')))other.close();document.documentElement.dataset.transport=netMode;onMessage(m);return;}
   if(selected===socket)onMessage(m);
  };
  socket.onclose=()=>{if(generation!==connectionGeneration)return;if(selected===socket){selected=null;if(activeRTC()){
     status.textContent='● WebRTC 直连 · 信令稍后恢复';
     const watch=setInterval(()=>{if(generation!==connectionGeneration){clearInterval(watch);return;}if(activeRTC())return;clearInterval(watch);mine=false;control.disabled=true;retry();},250);
    }else{rtcReady=false;pc?.close();mine=false;control.disabled=true;markDisconnected('公网连接中断，正在恢复');retry()}}else if(!selected&&sockets.every(s=>s.readyState>=2)){markDisconnected('公网连接失败，正在恢复');retry()}};socket.onerror=()=>{if(generation!==connectionGeneration)return;if(!selected)markDisconnected('公网连接失败');};
 }
 setTimeout(()=>{if(generation===connectionGeneration&&!selected&&!activeRTC()){for(const s of sockets)s.close();retry()}},2000);
}

control.onclick=()=>{preferControl=!mine;send({type:mine?'release':'claim'})};document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
function mods(e){return(e.altKey?1:0)|(e.ctrlKey?2:0)|(e.metaKey?4:0)|(e.shiftKey?8:0)}
function position(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(remoteWidth,(e.clientX-r.left)/r.width*remoteWidth)),y:Math.max(0,Math.min(remoteHeight,(e.clientY-r.top)/r.height*remoteHeight))}}
function mouse(e,type){const buttons=['left','middle','right'];act({kind:'mouse',params:{type,...position(e),button:type==='mouseMoved'?(e.buttons&1?'left':e.buttons&2?'right':e.buttons&4?'middle':'none'):buttons[e.button]||'none',buttons:e.buttons,clickCount:Math.min(2,e.detail||1),modifiers:mods(e)}})}
canvas.onpointerdown=e=>{if(!mine)return;e.preventDefault();keyboard.focus({preventScroll:true});canvas.setPointerCapture(e.pointerId);mouse(e,'mousePressed')};canvas.onpointerup=e=>{if(!mine)return;e.preventDefault();mouse(e,'mouseReleased')};canvas.onpointermove=e=>{if(!mine||performance.now()-lastMove<25)return;lastMove=performance.now();mouse(e,'mouseMoved')};canvas.oncontextmenu=e=>{if(mine)e.preventDefault()};canvas.addEventListener('wheel',e=>{if(!mine)return;e.preventDefault();const factor=e.deltaMode===1?16:e.deltaMode===2?remoteHeight:1;act({kind:'mouse',params:{type:'mouseWheel',...position(e),deltaX:e.deltaX*factor,deltaY:e.deltaY*factor,modifiers:mods(e)}})},{passive:false});
const vk={Backspace:8,Tab:9,Enter:13,Shift:16,Control:17,Alt:18,Escape:27,PageUp:33,PageDown:34,End:35,Home:36,ArrowLeft:37,ArrowUp:38,ArrowRight:39,ArrowDown:40,Insert:45,Delete:46,Meta:91,F1:112,F2:113,F3:114,F4:115,F5:116,F6:117,F7:118,F8:119,F9:120,F10:121,F11:122,F12:123};
function key(e,type){if(!mine||composing||e.isComposing||e.key==='Process'||e.keyCode===229)return;if((e.ctrlKey||e.metaKey)&&['c','v'].includes(e.key.toLowerCase())){if(e.key.toLowerCase()==='c'){e.preventDefault();if(type==='rawKeyDown'&&!e.repeat)copyRemote();}return;}const shortcut=e.ctrlKey||e.metaKey||e.altKey;if(vk[e.key]||shortcut){e.preventDefault();act({kind:'key',params:{type,key:e.key,code:e.code,windowsVirtualKeyCode:vk[e.key]||e.keyCode,modifiers:mods(e),autoRepeat:e.repeat}})}}
// Commit text once. Pre-edit strings remain local until the IME commits them.
let compositionCommit=null,ignoreNextInput=null;
function commitText(text){if(mine&&typeof text==='string'&&text.length)act({kind:'text',text});}
function clearLocalInput(){keyboard.value='';}
function finishComposition(e){
 const text=typeof e.data==='string'?e.data:'';
 composing=false;compositionCommit=text;ignoreNextInput=null;
 commitText(text);
 // Do not reset the editing host while the IME is still dispatching its commit.
 setTimeout(()=>{if(!composing)clearLocalInput()},0);
}
keyboard.onkeydown=e=>{if(!e.isComposing&&e.keyCode!==229&&!composing){compositionCommit=null;ignoreNextInput=null}key(e,'rawKeyDown')};
keyboard.onkeyup=e=>key(e,'keyUp');
keyboard.addEventListener('compositionstart',()=>{composing=true;compositionCommit=null;ignoreNextInput=null;});
keyboard.addEventListener('compositionend',finishComposition);
keyboard.onbeforeinput=e=>{
 const type=e.inputType||'';
 if(e.isComposing||type==='insertCompositionText'){if(compositionCommit===null)composing=true;return;}
 if(type==='insertFromComposition'||(compositionCommit!==null&&e.data===compositionCommit)){
  if(e.cancelable)e.preventDefault();ignoreNextInput=e.data;clearLocalInput();return;
 }
 if(composing)return;
 if(type==='insertText'&&typeof e.data==='string'&&e.cancelable){e.preventDefault();ignoreNextInput=e.data;commitText(e.data);clearLocalInput();}
};
keyboard.oninput=e=>{
 const type=e.inputType||'';
 if(e.isComposing||composing||type==='insertCompositionText')return;
 if(type==='insertFromComposition'||(compositionCommit!==null&&e.data===compositionCommit)){clearLocalInput();return;}
 if(ignoreNextInput!==null&&e.data===ignoreNextInput){ignoreNextInput=null;clearLocalInput();return;}
 // Use this event's committed delta, never resend the accumulated textarea value.
 if(type==='insertText'&&typeof e.data==='string')commitText(e.data);

};
keyboard.onpaste=e=>{
 if(!mine)return;e.preventDefault();compositionCommit=null;ignoreNextInput=null;composing=false;
 const transfer=e.clipboardData,items=[];
 for(const mime of ['text/plain','text/html'])if(transfer.types.includes(mime))items.push({mime,blob:new Blob([transfer.getData(mime)],{type:mime})});
 for(const file of transfer.files)if(file.type==='image/png')items.push({mime:'image/png',blob:file});
 pasteRemote(items).catch(e=>clipboardFailure(e));clearLocalInput();
};
const clipboardPending=new Map();
function clipboardFailure(error){hint.textContent='复制粘贴失败：'+String(error?.message||error);reportError('clipboard',error);}
function finishClipboard(message){
 const pending=clipboardPending.get(message.id);if(!pending)return;clipboardPending.delete(message.id);clearTimeout(pending.timer);
 if(pending.epoch!==streamEpoch||(!message.epoch&&message.type!=='clipboardError')||(message.epoch&&message.epoch!==pending.epoch)){pending.reject(Error('剪贴板目标已经变化'));return;}
 message.type==='clipboardError'?pending.reject(Error(message.message)):pending.resolve(message);
}
function clipboardRequest(action,items){
 if(!mine||!sourceConnected)return Promise.reject(Error('当前窗口尚未取得控制'));
 const id=crypto.randomUUID(),epoch=streamEpoch;
 return new Promise((resolve,reject)=>{
  const timer=setTimeout(()=>{clipboardPending.delete(id);reject(Error('剪贴板传输超时；未重放操作'))},7000);
  clipboardPending.set(id,{resolve,reject,timer,epoch});send({type:'clipboard',id,epoch,action,items});
 });
}
function rejectClipboard(){for(const pending of clipboardPending.values()){clearTimeout(pending.timer);pending.reject(Error('连接或目标窗口已变化'))}clipboardPending.clear();}
function decodeClipboard(item){return new Blob([Uint8Array.from(atob(item.data),c=>c.charCodeAt(0))],{type:item.mime});}
async function encodeClipboard(blob){
 if(blob.size>16777216)throw Error('剪贴板内容超过16 MiB传输上限');
 const data=new Uint8Array(await blob.arrayBuffer());let binary='';
 for(let i=0;i<data.length;i+=32768)binary+=String.fromCharCode(...data.subarray(i,i+32768));

}
function copyRemote(){
 if(!navigator.clipboard?.write||!window.ClipboardItem){clipboardFailure(Error('当前浏览器未提供安全剪贴板接口'));return;}
 const epoch=streamEpoch;const response=clipboardRequest('copy');
 // Start a write inside the actual Ctrl+C activation; its Blob resolves on reply.
 const text=response.then(m=>{if(epoch!==streamEpoch||!mine)throw Error('复制目标已经变化');const item=m.items.find(i=>i.mime==='text/plain');if(!item)throw Error('远端剪贴板没有纯文本格式');return decodeClipboard(item)});

 Promise.all([response,plainResult]).then(async([message,plain])=>{
  if(epoch!==streamEpoch||!mine)throw Error('复制目标已经变化');
  const items=Object.fromEntries(message.items.filter(i=>!ClipboardItem.supports||ClipboardItem.supports(i.mime)).map(i=>[i.mime,decodeClipboard(i)]));

async function pasteRemote(items){
 if(!items.length)throw Error('剪贴板中没有浏览器支持的内容');
 const epoch=streamEpoch,encoded=[];let size=0;
 for(const item of items){size+=item.blob.size;if(size>16777216)throw Error('剪贴板内容超过16 MiB传输上限');encoded.push({mime:item.mime,data:await encodeClipboard(item.blob)})}
 if(epoch!==streamEpoch||!mine)throw Error('粘贴目标已变化');await clipboardRequest('paste',encoded);
}
keyboard.addEventListener('blur',()=>{composing=false;compositionCommit=null;ignoreNextInput=null;clearLocalInput();});

document.addEventListener('visibilitychange',()=>{
 const visible=document.visibilityState==='visible';
 if(visible){connectingAt=performance.now();lastTransportAt=connectingAt;lastProofAt=connectingAt;lastProofSentAt=0;frameProofs.clear();proofRequests.clear();awaitingFreshProof=true;haveFrame=false;markDisconnected('正在确认实时画面');}
 send({type:'visibility',visible});
 if(visible){lastProofSentAt=performance.now();requestFrameProof();}
});
window.addEventListener('blur',()=>{if(mine)send({type:'resetKeys'})});window.addEventListener('focus',()=>{if(preferControl)send({type:'claim'})});
setInterval(()=>{rtcReady=activeRTC();if(!nativeWindow&&netMode!=='local'&&!rtcReady&&ws?.readyState===1&&performance.now()-lastRtcAttempt>45000)beginRTC().catch(e=>reportError('viewer-async',e));if(activeRTC()&&performance.now()-lastPongAt>6000){pc?.close();rtcReady=false;}if(inputSocket?.readyState===1||activeRTC())send({type:'ping',sent:performance.now()});if(performance.now()-lastTransportAt>1600){markDisconnected('未及时收到连接确认');if(ws?.readyState===1||activeRTC())recoverTransport('连接确认超时，正在恢复');}else if(document.visibilityState==='visible'&&!forcedRecoveryTimer&&!haveFrame&&performance.now()-connectingAt>10000){reportError('first-frame-timeout','未收到远端实时画面');recoverTransport('未收到远端实时画面，正在恢复');}if(document.visibilityState==='visible'&&(ws?.readyState===1||activeRTC())&&performance.now()-lastProofSentAt>4000){lastProofSentAt=performance.now();requestFrameProof();}if(document.visibilityState==='visible'&&haveFrame&&performance.now()-lastProofAt>12000){markDisconnected('画面确认超时，正在恢复');reportError('frame-proof-timeout','画面确认超时；可见状态='+document.visibilityState+'；已绘制序号='+lastFrameSeq+'；待确认='+frameProofs.size);recoverTransport('画面确认超时，正在恢复');lastProofAt=performance.now();}flushErrors();stats.textContent=`${netMode==='local'?'本机直连':rtcReady?'WebRTC':'中继'} · ${count} 帧/秒 · 已绘制 ${painted} 帧`;count=0},500);connect();

}
